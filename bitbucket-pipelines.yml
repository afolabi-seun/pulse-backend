definitions:
  caches:
    sonar: ~/.sonar
  
  steps:
    - step: &security-scan
        name: Security Scan
        on-fail:
          strategy: ignore
        script:
          - pipe: atlassian/git-secrets-scan:3.2.0

    - step: &sonarqube-scan
        name: Sonarqube static code analysis
        image: mcr.microsoft.com/dotnet/sdk:8.0
        caches:
          - dotnetcore
          - sonar
        script:
          - echo "Updating packages and installing Java Runtime."
          - apt-get update
          - apt-get install --yes openjdk-17-jre

          - echo "Installing jq for JSON processing..."
          - apt-get install --yes jq

          - cd Pulse.Api

          - echo "Installing SonarScanner for .NET..."
          - dotnet tool install --global dotnet-sonarscanner

          - echo "Adding .NET global tools to PATH..."
          - export PATH="$PATH:/root/.dotnet/tools"

          - echo "Starting SonarQube analysis..."
          - dotnet sonarscanner begin /k:"pulse-service" /d:"sonar.login=${SONAR_TOKEN}" /d:"sonar.host.url=${SONAR_HOST_URL}" # /d:"sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml" /d:"sonar.coverage.exclusions=**/Migrations/**,**/obj/**,**/bin/**,**/DesignTimeDbContextFactory.cs,**/Core/Extensions/**,**/Data/*DbContext.cs,**/Data/DTOs/ApiResponse.cs,**/Infrastructure/BackgroundServices/**,**/Infrastructure/Repositories/**,**/Core/Middleware/**,**/Core/Attributes/**,**/Core/Helpers/**,**/Data/Interceptors/**,**/Data/Models/**,**/Configuration/**,**/Program.cs,**/Infrastructure/Services/CircuitBreaker/**,**/Infrastructure/Services/EventIngestion/**,**/Infrastructure/Services/EventProcessing/**,**/Infrastructure/Services/OptOut/**,**/Infrastructure/Services/Outbox/**,**/Infrastructure/Services/Preference/**,**/Infrastructure/Services/RateLimiter/**,**/Infrastructure/Services/Routing/**,**/Infrastructure/Services/AuditLog/**,**/Infrastructure/ServiceClients/**,**/Core/Filters/**,**/Controllers/**,**/Data/DTOs/**" /d:"sonar.exclusions=**/Migrations/**"

          - echo "Building the project with .NET SDK 8.0..."
          - dotnet build Pulse.Api.csproj --no-incremental

          # - echo "Running Integration tests with coverage..."
          # - dotnet test ../Pulse.IntegrationTests/Pulse.IntegrationTests.csproj --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory $(pwd)/TestResults

          # - echo "Running Unit tests with coverage..."
          # - dotnet test ../Pulse.UnitTests/Pulse.UnitTests.csproj --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory $(pwd)/TestResults

          - echo "Running Integration tests with coverage..."
          - dotnet test ../Pulse.IntegrationTests/Pulse.IntegrationTests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          - echo "Running Unit tests with coverage..."
          - dotnet test ../Pulse.UnitTests/Pulse.UnitTests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          - echo "Finalizing SonarQube analysis..."
          - dotnet sonarscanner end /d:"sonar.login=${SONAR_TOKEN}"

          - echo "Waiting for SonarQube analysis to complete..."
          - sleep 30

          - echo "Checking SonarQube Quality Gate Status..."
          - |
            QUALITY_GATE_RESPONSE=$(curl -s -u ${SONAR_TOKEN}: "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=pulse-service")
            QUALITY_GATE_STATUS=$(echo "$QUALITY_GATE_RESPONSE" | jq -r '.projectStatus.status')
            if [ "$QUALITY_GATE_STATUS" != "OK" ]; then
              echo "Quality Gate failed. Status: $QUALITY_GATE_STATUS"
              echo "Failing conditions:"
              echo "$QUALITY_GATE_RESPONSE" | jq '.projectStatus.conditions[] | select(.status != "OK") | {metric: .metricKey, status: .status, actual: .actualValue, threshold: .errorThreshold}'
              exit 1
            else
              echo "Quality Gate passed. Status: $QUALITY_GATE_STATUS"
            fi

    # TODO: this project has no deployment infrastructure of its own yet — the image name, SSH
    # target, and server paths below are placeholders. Point DOCKER_* / DEV_SSH_KEY / the server
    # variables at Pulse's own registry and host before enabling deployment.
    - step: &build-push-docker-image-dev
        name: Build and Push Docker Image
        services:
          - docker
        script:
          - export IMAGE_NAME="pulse/pulse_service"
          - export IMAGE_TAG="latest"
          - export FULL_IMAGE_NAME="$IMAGE_NAME:$IMAGE_TAG"
          - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          - docker build -f Pulse.Api/Dockerfile -t pulse/pulse_service:latest .
          - docker push pulse/pulse_service:latest

    - step: &docker-swarm-deployment
        name: Pull Docker image and restart service
        image: alpine:latest
        runs-on:
          - self.hosted
          - linux
        script:
          - apk add --no-cache openssh-client
          - mkdir -p ~/.ssh
          - echo "$DEV_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          - chmod 600 ~/.ssh/id_ed25519
          - ssh-keyscan -H $deploy_svr_ip >> ~/.ssh/known_hosts
          - ssh -i ~/.ssh/id_ed25519 $deploy_svr_user@$deploy_svr_ip "echo \"$DOCKER_PASSWORD\" | docker login -u \"$DOCKER_USERNAME\" --password-stdin"
          - ssh -i ~/.ssh/id_ed25519 $deploy_svr_user@$deploy_svr_ip 'docker pull pulse/pulse_service'
          - ssh -i ~/.ssh/id_ed25519 $deploy_svr_user@$deploy_svr_ip 'docker service rm pulse-service-cluster || true'
          - ssh -i ~/.ssh/id_ed25519 $deploy_svr_user@$deploy_svr_ip 'docker service create --name pulse-service-cluster --constraint "node.hostname==pulse-docker-swarm-server" --env-file /srv/pulse-service/.env --replicas=1 -p 9106:8080 pulse/pulse_service:latest'

pipelines:
  branches:
    dev:
      - step: *security-scan
    #  - step: *sonarqube-scan
      - step: *build-push-docker-image-dev
      - step: *docker-swarm-deployment