name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build API
        run: dotnet build Pulse.Api --configuration Release

      - name: Unit tests
        run: dotnet test Pulse.UnitTests --configuration Release

      # Testcontainers starts its own Postgres; Docker is preinstalled on ubuntu-latest.
      - name: Integration tests
        run: dotnet test Pulse.IntegrationTests --configuration Release
